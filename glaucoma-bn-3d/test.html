<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        .test-container {
            background: #f5f5f5;
            padding: 30px;
            border-radius: 10px;
            margin: 20px 0;
        }
        canvas {
            border: 2px solid #ddd;
            border-radius: 8px;
            margin: 20px 0;
        }
        .url-display {
            background: #e9ecef;
            padding: 10px;
            border-radius: 5px;
            word-break: break-all;
            font-family: monospace;
            margin: 10px 0;
        }
        .status {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>QR Code Test Page</h1>
    
    <div class="test-container">
        <h2>Test QR Code Generation</h2>
        <canvas id="qrCode" width="200" height="200"></canvas>
        <div class="url-display" id="qrUrl">Loading...</div>
        <div id="status" class="status info">Initializing...</div>
    </div>
    
    <div class="test-container">
        <h2>Instructions</h2>
        <p>1. Check if a QR code appears above</p>
        <p>2. Try scanning it with your phone camera</p>
        <p>3. It should take you to: <strong id="expectedUrl"></strong></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script>
        const statusDiv = document.getElementById('status');
        const qrCanvas = document.getElementById('qrCode');
        const qrUrlDiv = document.getElementById('qrUrl');
        const expectedUrlDiv = document.getElementById('expectedUrl');
        
        const currentUrl = window.location.href.replace('/test.html', '/index.html');
        expectedUrlDiv.textContent = currentUrl;
        
        function updateStatus(message, type = 'info') {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }
        
        function testQRGeneration() {
            updateStatus('Testing QR code generation...', 'info');
            
            if (typeof QRCode === 'undefined') {
                updateStatus('❌ QRCode library not loaded', 'error');
                return;
            }
            
            updateStatus('✅ QRCode library loaded, generating QR code...', 'success');
            
            QRCode.toCanvas(qrCanvas, currentUrl, {
                width: 200,
                height: 200,
                color: {
                    dark: '#000000',
                    light: '#FFFFFF'
                },
                margin: 2,
                errorCorrectionLevel: 'M'
            }, (error) => {
                if (error) {
                    updateStatus(`❌ QR Code generation failed: ${error.message}`, 'error');
                } else {
                    updateStatus('✅ QR Code generated successfully! Try scanning it.', 'success');
                    qrUrlDiv.textContent = currentUrl;
                }
            });
        }
        
        // Test immediately
        setTimeout(testQRGeneration, 1000);
        
        // Also test after a longer delay
        setTimeout(() => {
            if (qrCanvas.width === 0) {
                updateStatus('❌ QR Code still not generated after 5 seconds', 'error');
            }
        }, 5000);
    </script>
</body>
</html>
